plugins {
    id 'com.android.application'
}

// The modern editor source is transpiled for the Android 8 system WebView before packaging.
def generatedWebViewAssets = file("$buildDir/generated/webview-assets")
android.sourceSets.main.assets.srcDir(generatedWebViewAssets)
def transpileWebViewForLegacyAndroid = tasks.register("transpileWebViewForLegacyAndroid", Exec) {
    def inputHtml = rootProject.file("app/src/main/assets/index.html")
    def transpiler = rootProject.file("scripts/transpile-webview.cjs")
    def typescriptCompiler = rootProject.file("backend/node_modules/typescript/lib/typescript.js")
    def generatedHtml = new File(generatedWebViewAssets, "index-android.html")
    inputs.files(inputHtml, transpiler, typescriptCompiler)
    outputs.file(generatedHtml)
    commandLine "node", transpiler.absolutePath, inputHtml.absolutePath, generatedHtml.absolutePath
}
tasks.named("preBuild").configure { dependsOn(transpileWebViewForLegacyAndroid) }
android {
    namespace 'com.ispinalokalnie.redaktor'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ispinalokalnie.redaktorsmart.stable'
        testApplicationId 'com.ispinalokalnie.redaktorsmart.stable.instrumentation'
        testInstrumentationRunner 'com.ispinalokalnie.redaktor.ConfirmationInstrumentation'
        minSdk 26
        targetSdk 35
        versionCode 49
        versionName '2.0.0-professional-test.5'
        def assistantEndpoint = System.getenv('IL_ASSISTANT_ENDPOINT') ?: project.findProperty('ilAssistantEndpoint') ?: 'https://il-redaktor-assistant.vercel.app/api/assistant'
        if (assistantEndpoint && !assistantEndpoint.toString().startsWith('https://')) {
            throw new GradleException('IL_ASSISTANT_ENDPOINT must use HTTPS.')
        }
        buildConfigField 'String', 'ASSISTANT_ENDPOINT', '"' + assistantEndpoint.toString().replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            def keyPath = System.getenv('IL_RELEASE_KEYSTORE_PATH')
            if (keyPath != null && !keyPath.isEmpty()) {
                storeFile file(keyPath)
                storePassword System.getenv('IL_RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('IL_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('IL_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            def keyPath = System.getenv('IL_RELEASE_KEYSTORE_PATH')
            if (keyPath != null && !keyPath.isEmpty()) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.work:work-runtime:2.10.1'
}
