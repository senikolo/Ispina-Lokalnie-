# Szkic do przeniesienia do fdroiddata; przed zgłoszeniem potwierdź prawa do danych gminnych.
Categories:
  - Navigation
License: GPL-3.0-only
AuthorName: Ispina Lokalnie
Name: Ispina Lokalnie
Summary: Lokalne informacje i narzędzia dla mieszkańców
Description: |-
  Lokalna aplikacja dla mieszkańców Ispiny i okolic.
  - Wyszukiwanie połączeń MLD bezpośrednich i z jedną przesiadką; rozkład jest pobierany na żądanie i przechowywany na urządzeniu.
  - Rozkład linii gminnej z czytelnym oznaczeniem orientacyjnych czasów pośrednich.
  - Aktualności i historia Ispiny, prognoza pogody na trzy dni oraz harmonogram odbioru odpadów.
  - Przypomnienia lokalne, lektor systemowy, udostępnianie trasy i tryb z większym tekstem.
  Aplikacja nie zawiera reklam ani analityki. Do odświeżania treści potrzebne jest połączenie z internetem.
