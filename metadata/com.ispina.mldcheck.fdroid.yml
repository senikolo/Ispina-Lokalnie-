MaintainerNotes: |-
  Szkic metadanych. Nie wysyłaj do głównego repozytorium F-Droid, dopóki nie zostaną potwierdzone warunki ponownego użycia danych rozkładu gminnego i harmonogramu odpadów.
  Zbuduj ponownie przypięty commit w środowisku F-Droid i wykonaj testy na urządzeniu przed zgłoszeniem.
