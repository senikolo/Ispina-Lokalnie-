name: Build Ispina Lokalnie UltraSmart 78 Wideo

on:
  push:
    branches:
      - codex/il-ultrasmart78-video-20261028
    paths:
      - tools/ultrasmart78-video-tab/**
      - .github/workflows/build-ultrasmart78-video.yml

permissions:
  contents: read
  actions: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Patch UltraSmart 77 into version 78
        run: |
          set -euo pipefail
          python3 tools/ultrasmart78-video-tab/patch_ultrasmart78_video.py \
            downloads/Ispina-Lokalnie-UltraSmart-77-Drogowskaz.apk \
            Ispina-Lokalnie-UltraSmart-78-WIDEO-UNSIGNED.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IL-UltraSmart-78-WIDEO-UNSIGNED
          path: Ispina-Lokalnie-UltraSmart-78-WIDEO-UNSIGNED.apk
          retention-days: 14

  sign:
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IL_ULTRASMART77_KEYSTORE_B64: ${{ secrets.IL_ULTRASMART77_KEYSTORE_B64 }}
      IL_ULTRASMART77_KEYSTORE_PASS: ${{ secrets.IL_ULTRASMART77_KEYSTORE_PASS }}
      EXPECTED_CERT_SHA256: "E1:71:05:F5:C6:6B:EE:C0:85:08:AC:2E:7D:60:F9:F2:7B:85:B8:0E:F0:F6:E2:31:83:A7:06:42:C6:DA:E8:A3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build tools
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      - name: Inspect UltraSmart 77 signing certificate
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          SOURCE_CERT="$("$BT/apksigner" verify --print-certs downloads/Ispina-Lokalnie-UltraSmart-77-Drogowskaz.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}')"
          test -n "$SOURCE_CERT"
          echo "UltraSmart 77 certificate SHA-256: $SOURCE_CERT"
          EXPECTED_COMPACT="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
          SOURCE_COMPACT="$(printf '%s' "$SOURCE_CERT" | tr -d ' ' | tr 'A-F' 'a-f')"
          test "$SOURCE_COMPACT" = "$EXPECTED_COMPACT"
      - uses: actions/download-artifact@v4
        with:
          name: IL-UltraSmart-78-WIDEO-UNSIGNED
          path: unsigned-artifact
      - name: Report missing UltraSmart 77 signing key
        if: ${{ env.IL_ULTRASMART77_KEYSTORE_B64 == '' || env.IL_ULTRASMART77_KEYSTORE_PASS == '' }}
        run: |
          echo "::warning::Signing skipped. Add the original UltraSmart 77 signing keystore as IL_ULTRASMART77_KEYSTORE_B64 and IL_ULTRASMART77_KEYSTORE_PASS repository secrets."
      - name: Sign only with the matching UltraSmart 77 key
        id: sign
        if: ${{ env.IL_ULTRASMART77_KEYSTORE_B64 != '' && env.IL_ULTRASMART77_KEYSTORE_PASS != '' }}
        run: |
          set -euo pipefail
          printf '%s' "$IL_ULTRASMART77_KEYSTORE_B64" | base64 -d > ultrasmart77-signing.p12
          EXPECTED_COMPACT="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
          KEY_ALIAS="$(keytool -list -v -storetype PKCS12 -keystore ultrasmart77-signing.p12 -storepass "$IL_ULTRASMART77_KEYSTORE_PASS" | awk -F': ' '/Alias name:/{alias=$2} /SHA256:/{print alias "|" $2}' | awk -F'|' -v expected="$EXPECTED_COMPACT" '{cert=tolower($2); gsub(/:/, "", cert); if (cert == expected) { print $1; exit }}')"
          test -n "$KEY_ALIAS"
          ACTUAL_CERT="$(keytool -list -v -storetype PKCS12 -keystore ultrasmart77-signing.p12 -storepass "$IL_ULTRASMART77_KEYSTORE_PASS" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}')"
          ACTUAL_COMPACT="$(printf '%s' "$ACTUAL_CERT" | tr -d ':' | tr 'A-F' 'a-f')"
          test "$ACTUAL_COMPACT" = "$EXPECTED_COMPACT"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 unsigned-artifact/Ispina-Lokalnie-UltraSmart-78-WIDEO-UNSIGNED.apk aligned.apk
          "$BT/apksigner" sign \
            --ks ultrasmart77-signing.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:IL_ULTRASMART77_KEYSTORE_PASS \
            --key-pass env:IL_ULTRASMART77_KEYSTORE_PASS \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Ispina-Lokalnie-UltraSmart-78-WIDEO.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs Ispina-Lokalnie-UltraSmart-78-WIDEO.apk > verify.txt
          grep -qi "$EXPECTED_COMPACT" verify.txt
          "$BT/zipalign" -c -v 4 Ispina-Lokalnie-UltraSmart-78-WIDEO.apk >/dev/null
      - uses: actions/upload-artifact@v4
        if: ${{ steps.sign.outcome == 'success' }}
        with:
          name: IL-UltraSmart-78-WIDEO-SIGNED
          path: |
            Ispina-Lokalnie-UltraSmart-78-WIDEO.apk
            verify.txt
          retention-days: 30
