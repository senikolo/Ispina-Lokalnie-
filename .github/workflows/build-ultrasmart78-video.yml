name: Build Ispina Lokalnie UltraSmart 78 Wideo

on:
  push:
    branches:
      - codex/il-ultrasmart78-video-20261028
    paths:
      - tools/ultrasmart78-video-tab/**
      - .github/workflows/build-ultrasmart78-video.yml

permissions:
  contents: read
  actions: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Patch UltraSmart 77 into version 78
        run: |
          set -euo pipefail
          python3 tools/ultrasmart78-video-tab/patch_ultrasmart78_video.py \
            downloads/Ispina-Lokalnie-UltraSmart-77-Drogowskaz.apk \
            Ispina-Lokalnie-UltraSmart-78-WIDEO-UNSIGNED.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IL-UltraSmart-78-WIDEO-UNSIGNED
          path: Ispina-Lokalnie-UltraSmart-78-WIDEO-UNSIGNED.apk
          retention-days: 14

  sign:
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IL_STABLE_KEYSTORE_B64: ${{ secrets.IL_STABLE_KEYSTORE_B64 }}
      IL_STABLE_KEYSTORE_PASS: ${{ secrets.IL_STABLE_KEYSTORE_PASS }}
      EXPECTED_CERT_SHA256: "6D:75:BA:F7:F4:40:2F:F9:3C:93:50:5F:D6:D7:A5:C0:EA:B3:D1:C7:C2:AA:2A:39:EE:B5:E4:AE:16:6F:62:5F"
      KEY_ALIAS: ispina-lokalnie-stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build tools
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      - name: Inspect UltraSmart 77 signing certificate
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          SOURCE_CERT="$("$BT/apksigner" verify --print-certs downloads/Ispina-Lokalnie-UltraSmart-77-Drogowskaz.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}')"
          test -n "$SOURCE_CERT"
          echo "UltraSmart 77 certificate SHA-256: $SOURCE_CERT"
          EXPECTED_COMPACT="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
          SOURCE_COMPACT="$(printf '%s' "$SOURCE_CERT" | tr -d ' ' | tr 'A-F' 'a-f')"
          if [ "$SOURCE_COMPACT" = "$EXPECTED_COMPACT" ]; then
            echo "The source APK matches the configured IL stable signing certificate."
          else
            echo "The source APK uses a different signing certificate."
          fi
      - uses: actions/download-artifact@v4
        with:
          name: IL-UltraSmart-78-WIDEO-UNSIGNED
          path: unsigned-artifact
      - name: Report missing signing key
        if: ${{ env.IL_STABLE_KEYSTORE_B64 == '' || env.IL_STABLE_KEYSTORE_PASS == '' }}
        run: |
          echo "::warning::Signing skipped: IL_STABLE_KEYSTORE_B64 or IL_STABLE_KEYSTORE_PASS is missing in this repository."
      - name: Sign only when the stable key is available
        id: sign
        if: ${{ env.IL_STABLE_KEYSTORE_B64 != '' && env.IL_STABLE_KEYSTORE_PASS != '' }}
        run: |
          set -euo pipefail
          printf '%s' "$IL_STABLE_KEYSTORE_B64" | base64 -d > stable-signing.p12
          ACTUAL="$(keytool -list -v -storetype PKCS12 -keystore stable-signing.p12 -storepass "$IL_STABLE_KEYSTORE_PASS" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}')"
          test "$ACTUAL" = "$EXPECTED_CERT_SHA256"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          BASE_CERT="$("$BT/apksigner" verify --print-certs downloads/Ispina-Lokalnie-UltraSmart-77-Drogowskaz.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}')"
          EXPECTED_COMPACT="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
          test "$(printf '%s' "$BASE_CERT" | tr -d ' ' | tr 'A-F' 'a-f')" = "$EXPECTED_COMPACT"
          "$BT/zipalign" -p -f 4 unsigned-artifact/Ispina-Lokalnie-UltraSmart-78-WIDEO-UNSIGNED.apk aligned.apk
          "$BT/apksigner" sign \
            --ks stable-signing.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:IL_STABLE_KEYSTORE_PASS \
            --key-pass env:IL_STABLE_KEYSTORE_PASS \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Ispina-Lokalnie-UltraSmart-78-WIDEO.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs Ispina-Lokalnie-UltraSmart-78-WIDEO.apk > verify.txt
          grep -qi "$EXPECTED_COMPACT" verify.txt
          "$BT/zipalign" -c -v 4 Ispina-Lokalnie-UltraSmart-78-WIDEO.apk >/dev/null
      - uses: actions/upload-artifact@v4
        if: ${{ steps.sign.outcome == 'success' }}
        with:
          name: IL-UltraSmart-78-WIDEO-SIGNED
          path: |
            Ispina-Lokalnie-UltraSmart-78-WIDEO.apk
            verify.txt
          retention-days: 30
