name: Kindle Wi-Fi 2.26
on:
  push:
    branches:
      - codex/kindle-wifi-radio-audio-2-26-20261110
    paths:
      - build-sources/kindle-wifi-2.26-audio.zip.b64
      - .github/workflows/kindle-wifi-audio-2-26.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Android SDK platforms
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Decode checked source bundle
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kindle"
          base64 -d build-sources/kindle-wifi-2.26-audio.zip.b64 > "$RUNNER_TEMP/kindle/sources.zip"
          unzip -q "$RUNNER_TEMP/kindle/sources.zip" -d "$RUNNER_TEMP/kindle"
          test -f "$RUNNER_TEMP/kindle/kindle-wifi-2.26/build.gradle"
      - name: Unit and integration tests
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
          LANG: C.UTF-8
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v lua5.3 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg lua5.3 lua-filesystem
          fi
          cd "$RUNNER_TEMP/kindle/kindle-wifi-2.26"
          bash tests/run-atomic-tests.sh
      - name: Build release APK
        shell: bash
        run: |
          cd "$RUNNER_TEMP/kindle/kindle-wifi-2.26"
          gradle --no-daemon assembleRelease
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p build-artifacts
          cp "$RUNNER_TEMP/kindle/kindle-wifi-2.26/build/outputs/apk/release/"*-unsigned.apk build-artifacts/Kindle-przez-WiFi-2.26-unsigned.apk
          aapt2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$aapt2" dump badging build-artifacts/*.apk | tee build-artifacts/apk-manifest.txt
          grep -F "name='pl.ispinalokalnie.kindlewifi.v23' versionCode='30' versionName='2.26'" build-artifacts/apk-manifest.txt
          unzip -Z1 build-artifacts/*.apk > "$RUNNER_TEMP/apk-files.txt"
          grep -Fx assets/ilradio_k3.koplugin/player.sh "$RUNNER_TEMP/apk-files.txt"
          grep -Fx assets/patches/1-warszawski-czas.lua "$RUNNER_TEMP/apk-files.txt"
          grep -F assets/mlkit-google-ocr-models/ "$RUNNER_TEMP/apk-files.txt" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Kindle-przez-WiFi-2.26-release-unsigned
          path: build-artifacts/
          if-no-files-found: error

  android-smoke:
    name: Android API ${{ matrix.api }} smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 30, 33]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kindle-przez-WiFi-2.26-release-unsigned
          path: build-artifacts
      - name: Sign emulator-only copy
        shell: bash
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/emulator.p12" -storepass android -keypass android -alias emulator -dname CN=Emulator -keyalg RSA -keysize 2048 -validity 2
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$sdkmanager" 'build-tools;35.0.0'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/emulator.p12" --ks-pass pass:android --out "$RUNNER_TEMP/emulator.apk" build-artifacts/*-unsigned.apk
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kindlewifi-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open Kindle Wi-Fi
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/emulator.apk"
            adb shell am start -W -n pl.ispinalokalnie.kindlewifi.v23/pl.ispinalokalnie.kindlewifi.MainActivity | tee "$RUNNER_TEMP/launch.txt"
            grep -F "Status: ok" "$RUNNER_TEMP/launch.txt"
            adb shell uiautomator dump /sdcard/kindle-ui.xml
            adb shell cat /sdcard/kindle-ui.xml | grep -Fq 'Twoja kolejka'
