name: Kindle Wi-Fi 2.26
on:
  push:
    branches:
      - codex/kindle-wifi-radio-audio-2-26-20261110
    paths:
      - build-sources/kindle-wifi-2.26-audio.zip.b64
      - .github/workflows/kindle-wifi-audio-2-26.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Android SDK platforms
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Decode checked source bundle
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kindle"
          base64 -d build-sources/kindle-wifi-2.26-audio.zip.b64 > "$RUNNER_TEMP/kindle/sources.zip"
          unzip -q "$RUNNER_TEMP/kindle/sources.zip" -d "$RUNNER_TEMP/kindle"
          test -f "$RUNNER_TEMP/kindle/kindle-wifi-2.26/build.gradle"
      - name: Unit and integration tests
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
          LANG: C.UTF-8
        run: |
          cd "$RUNNER_TEMP/kindle/kindle-wifi-2.26"
          bash tests/run-atomic-tests.sh
      - name: Build release APK
        shell: bash
        run: |
          cd "$RUNNER_TEMP/kindle/kindle-wifi-2.26"
          gradle --no-daemon assembleRelease
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p build-artifacts
          cp "$RUNNER_TEMP/kindle/kindle-wifi-2.26/build/outputs/apk/release/"*-unsigned.apk build-artifacts/Kindle-przez-WiFi-2.26-unsigned.apk
          aapt2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$aapt2" dump badging build-artifacts/*.apk | tee build-artifacts/apk-manifest.txt
          grep -F "name='pl.ispinalokalnie.kindlewifi.v23' versionCode='30' versionName='2.26'" build-artifacts/apk-manifest.txt
          unzip -Z1 build-artifacts/*.apk > "$RUNNER_TEMP/apk-files.txt"
          grep -Fx assets/ilradio_k3.koplugin/player.sh "$RUNNER_TEMP/apk-files.txt"
          grep -Fx assets/patches/1-warszawski-czas.lua "$RUNNER_TEMP/apk-files.txt"
          grep -F assets/mlkit-google-ocr-models/ "$RUNNER_TEMP/apk-files.txt" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Kindle-przez-WiFi-2.26-release-unsigned
          path: build-artifacts/
          if-no-files-found: error
