name: IL Redaktor Smart - Android APK

on:
  push:
    branches:
      - codex/il-redaktor-native-android-20261031
    paths:
      - "il-redaktor-android/**"
      - ".github/workflows/il-redaktor-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Embed official Ispina Lokalnie monogram and launcher icons
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import urllib.request, io, pathlib
          from PIL import Image, ImageDraw
          url = 'https://ispinalokalnie.wordpress.com/wp-content/uploads/2026/10/ispina-lokalnie-monogram-il.png'
          raw = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'ILRedaktorSmart/1.1'}),timeout=30).read()
          if len(raw)>2_000_000: raise ValueError('Logo is unexpectedly large')
          im=Image.open(io.BytesIO(raw)).convert('RGBA')
          if im.width!=640 or im.height!=640: raise ValueError('Unexpected brand logo geometry')
          base=pathlib.Path('il-redaktor-android/app/src/main')
          assets=base/'assets'
          assets.mkdir(parents=True,exist_ok=True)
          (assets/'il-monogram.png').write_bytes(raw)
          # Official IL monogram stays intact; only the Android launcher gets
          # a small red identification dot with a narrow white separation ring.
          launch=im.copy()
          painter=ImageDraw.Draw(launch)
          cx,cy=int(im.width*0.83),int(im.height*0.17)
          radius=int(im.width*0.090)
          ring=max(5,int(im.width*0.024))
          painter.ellipse((cx-radius-ring,cy-radius-ring,cx+radius+ring,cy+radius+ring),
                          fill=(255,255,255,255))
          painter.ellipse((cx-radius,cy-radius,cx+radius,cy+radius),
                          fill=(222,43,52,255))
          for density,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              p=base/'res'/('mipmap-'+density)
              p.mkdir(parents=True,exist_ok=True)
              icon=launch.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(p/'ic_launcher.png')
              icon.save(p/'ic_launcher_round.png')
          check=Image.open(base/'res'/'mipmap-xxxhdpi'/'ic_launcher.png').convert('RGB')
          dot=check.getpixel((int(192*.83),int(192*.17)))
          assert dot[0]>195 and dot[1]<90 and dot[2]<100, 'Red launcher dot missing'
          print('Embedded unchanged IL logo plus small red dot on launcher icon:',len(raw),'bytes')
          PY
      - name: Validate source HTML and JavaScript
        run: |
          python - <<'PY'
          import pathlib,re
          src=pathlib.Path('il-redaktor-android/app/src/main/assets/index.html').read_text()
          match=re.search(r'<script>(.*?)</script>',src,flags=re.S)
          if not match: raise AssertionError('Editor JavaScript missing')
          pathlib.Path('/tmp/ilredaktor-ui.js').write_text(match.group(1))
          for required in ['il-monogram.png','function savePost','function loadMedia','function restoreLocal','function loadServices','function oneTapConnect']:
              assert required in src, required
          assert 'class="logo">IL' not in src, 'Old text-only monogram was not replaced'
          java=pathlib.Path('il-redaktor-android/app/src/main/java/com/ispinalokalnie/redaktor/MainActivity.java').read_text()
          assert 'void verifyConnection' in java
          assert 'AndroidKeyStore' in java
          oauth=pathlib.Path('il-redaktor-android/app/src/main/java/com/ispinalokalnie/redaktor/OAuthBrowserLogin.java').read_text()
          mcp=pathlib.Path('il-redaktor-android/app/src/main/java/com/ispinalokalnie/redaktor/WpMcp.java').read_text()
          main=pathlib.Path('il-redaktor-android/app/src/main/java/com/ispinalokalnie/redaktor/MainActivity.java').read_text()
          manifest=pathlib.Path('il-redaktor-android/app/src/main/AndroidManifest.xml').read_text()
          assert '"&scope=global"' in oauth, 'WordPress MCP requires the global scope, not auth-only'
          assert '"&scope=auth"' not in oauth, 'Auth-only scope cannot access WordPress MCP content'
          for expected in ['com.ispinalokalnie.redaktorsmart.mcp153:/callback','code_challenge_method=S256','PENDING_VERIFIER','handleRedirect']:
              assert expected in oauth, 'OAuth return missing: '+expected
          for required in ['\"method\", \"initialize\"', 'Mcp-Session-Id', 'notifications/initialized', 'ensureMcpSession(token)', 'ExpiredMcpSession', 'resetSession()']:
              assert required in mcp, 'Missing MCP session lifecycle: ' + required
          assert 'WpMcp.resetSession()' in main, 'Session must reset on account changes'
          assert 'response_types' in mcp and 'authorization_code' in mcp
          assert 'refresh_token' in mcp and 'refresh_token' in main, 'Token refresh is not wired end to end'
          assert 'putTokens(access, expires, refresh, true)' in main, 'Refresh token is not stored after consent'
          assert 'AndroidKeyStore' in main and 'encryptSecret' in main, 'Tokens are not encrypted at rest'
          assert 'JSONArray)data).length() == 0' in main, 'Login must confirm at least one existing article'
          assert 'response_type=token' not in main and 'response_type=token' not in oauth, 'Implicit OAuth flow must not be used'
          assert 'android:scheme="com.ispinalokalnie.redaktorsmart.mcp153"' in manifest
          for required in ['SUKCES!','NIE POWIODŁO SIĘ','function showOutcome','id="finish-dialog"']:
              assert required in src, 'Feedback UI missing: '+required
          assert 'client_secret' not in oauth and 'client_secret' not in src.lower()
          print('Required features and official IL branding confirmed')
          PY
          node --check /tmp/ilredaktor-ui.js
      - name: Verify WordPress.com supports the Android deep-link redirect
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          url='https://public-api.wordpress.com/oauth2-1/register'
          payload={'client_name':'IL Redaktor Smart Android Redirect CI',
                   'redirect_uris':['com.ispinalokalnie.redaktorsmart.mcp153:/callback'],
                   'grant_types':['authorization_code','refresh_token'],
                   'response_types':['code'],
                   'token_endpoint_auth_method':'none'}
          req=urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'),
                 headers={'Content-Type':'application/json','Accept':'application/json'},
                 method='POST')
          try:
              with urllib.request.urlopen(req,timeout=25) as response:
                  out=json.load(response)
              if not out.get('client_id'):
                  raise AssertionError('Registration returned no client_id')
              print('Android deep-link registration accepted by WordPress.com')
          except urllib.error.HTTPError as e:
              body=e.read(1000).decode('utf-8','replace')
              raise AssertionError(f'WordPress.com rejected native OAuth redirect: HTTP {e.code}, {body}')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: il-redaktor-android/backend/package-lock.json
      - name: Typecheck optional AI backend
        working-directory: il-redaktor-android/backend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
      - name: Compile Android APK
        working-directory: il-redaktor-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Confirm APK and actual monogram
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APK="il-redaktor-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test -s il-redaktor-android/app/src/main/assets/il-monogram.png
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.ispinalokalnie.redaktorsmart.scope153.test' versionCode='10' versionName='1.5.3-test'"
          unzip -l "$APK" | grep 'assets/il-monogram.png'
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: IL-Redaktor-Smart-APK
          path: il-redaktor-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Check whether release signing is configured
        id: release-key
        shell: bash
        env:
          IL_RELEASE_KEYSTORE_B64: ${{ secrets.IL_RELEASE_KEYSTORE_B64 }}
          IL_RELEASE_KEY_ALIAS: ${{ secrets.IL_RELEASE_KEY_ALIAS }}
          IL_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.IL_RELEASE_KEYSTORE_PASSWORD }}
          IL_RELEASE_KEY_PASSWORD: ${{ secrets.IL_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$IL_RELEASE_KEYSTORE_B64" && -n "$IL_RELEASE_KEY_ALIAS" && -n "$IL_RELEASE_KEYSTORE_PASSWORD" && -n "$IL_RELEASE_KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No release signing key configured; only the debug APK will be built."
          fi
      - name: Build signed release APK when a private signing key is configured
        if: steps.release-key.outputs.configured == 'true'
        working-directory: il-redaktor-android
        env:
          IL_RELEASE_KEYSTORE_B64: ${{ secrets.IL_RELEASE_KEYSTORE_B64 }}
          IL_RELEASE_KEY_ALIAS: ${{ secrets.IL_RELEASE_KEY_ALIAS }}
          IL_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.IL_RELEASE_KEYSTORE_PASSWORD }}
          IL_RELEASE_KEY_PASSWORD: ${{ secrets.IL_RELEASE_KEY_PASSWORD }}
          IL_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/il-redaktor-release.jks
        run: |
          printf '%s' "$IL_RELEASE_KEYSTORE_B64" | base64 --decode > "$IL_RELEASE_KEYSTORE_PATH"
          test -s "$IL_RELEASE_KEYSTORE_PATH"
          gradle --no-daemon :app:assembleRelease
      - name: Upload signed release APK
        if: steps.release-key.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: IL-Redaktor-Smart-Release-APK
          path: il-redaktor-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  # Publish a clearly marked PRERELEASE so Android users can download the APK
  # directly, without having to sign in to GitHub for Actions artifacts.
  # Only this job gets write permission; build/test jobs remain read-only.
  direct-download:
    if: github.ref == 'refs/heads/codex/il-redaktor-native-android-20261031'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve verified debug APK
        uses: actions/download-artifact@v4
        with:
          name: IL-Redaktor-Smart-APK
          path: android-package
      - name: Publish GitHub pre-release for direct Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="il-redaktor-smart-1.5.3-test"
          FILE="IL-Redaktor-Smart-1.5.3-TEST.apk"
          test -s android-package/app-debug.apk
          cp android-package/app-debug.apk "$FILE"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "IL Redaktor Smart 1.5.3 TEST (poprawa zakresu global)" \
              --notes "Wersja testowa Android 8+. Ikona Redaktora z czerwoną kropką. Poprawiona obsługa logowania WordPress.com i sesji MCP. Test na telefonie jest wymagany; nie scalać z main bez weryfikacji." \
              --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -Fx "$FILE"
