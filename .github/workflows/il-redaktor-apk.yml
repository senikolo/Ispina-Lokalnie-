name: IL Redaktor Smart - Android APK

on:
  push:
    branches:
      - codex/il-redaktor-native-android-20261031
    paths:
      - "il-redaktor-android/**"
      - ".github/workflows/il-redaktor-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      IL_ASSISTANT_ENDPOINT: ${{ secrets.IL_ASSISTANT_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Embed official Ispina Lokalnie monogram and launcher icons
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import urllib.request, io, pathlib
          from PIL import Image, ImageDraw
          url = 'https://ispinalokalnie.wordpress.com/wp-content/uploads/2026/10/ispina-lokalnie-monogram-il.png'
          raw = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'ILRedaktorSmart/1.1'}),timeout=30).read()
          if len(raw)>2_000_000: raise ValueError('Logo is unexpectedly large')
          im=Image.open(io.BytesIO(raw)).convert('RGBA')
          if im.width!=640 or im.height!=640: raise ValueError('Unexpected brand logo geometry')
          base=pathlib.Path('il-redaktor-android/app/src/main')
          assets=base/'assets'
          assets.mkdir(parents=True,exist_ok=True)
          (assets/'il-monogram.png').write_bytes(raw)
          # Official IL monogram stays intact; only the Android launcher gets
          # a small red identification dot with a narrow white separation ring.
          launch=im.copy()
          painter=ImageDraw.Draw(launch)
          cx,cy=int(im.width*0.83),int(im.height*0.17)
          radius=int(im.width*0.090)
          ring=max(5,int(im.width*0.024))
          painter.ellipse((cx-radius-ring,cy-radius-ring,cx+radius+ring,cy+radius+ring),
                          fill=(255,255,255,255))
          painter.ellipse((cx-radius,cy-radius,cx+radius,cy+radius),
                          fill=(222,43,52,255))
          for density,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              p=base/'res'/('mipmap-'+density)
              p.mkdir(parents=True,exist_ok=True)
              icon=launch.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(p/'ic_launcher.png')
              icon.save(p/'ic_launcher_round.png')
          check=Image.open(base/'res'/'mipmap-xxxhdpi'/'ic_launcher.png').convert('RGB')
          dot=check.getpixel((int(192*.83),int(192*.17)))
          assert dot[0]>195 and dot[1]<90 and dot[2]<100, 'Red launcher dot missing'
          print('Embedded unchanged IL logo plus small red dot on launcher icon:',len(raw),'bytes')
          PY
      - name: Validate source HTML and JavaScript
        run: |
          python - <<'PY'
          import pathlib,re
          src=pathlib.Path('il-redaktor-android/app/src/main/assets/index.html').read_text()
          match=re.search(r'<script>(.*?)</script>',src,flags=re.S)
          if not match: raise AssertionError('Editor JavaScript missing')
          pathlib.Path('/tmp/ilredaktor-ui.js').write_text(match.group(1))
          for required in ['il-monogram.png','function savePost','function loadMedia','function restoreLocal','function loadServices','function oneTapConnect']:
              assert required in src, required
          assert 'class="logo">IL' not in src, 'Old text-only monogram was not replaced'
          java=pathlib.Path('il-redaktor-android/app/src/main/java/com/ispinalokalnie/redaktor/MainActivity.java').read_text()
          assert 'void verifyConnection' in java
          assert 'AndroidKeyStore' in java
          oauth=pathlib.Path('il-redaktor-android/app/src/main/java/com/ispinalokalnie/redaktor/OAuthBrowserLogin.java').read_text()
          mcp=pathlib.Path('il-redaktor-android/app/src/main/java/com/ispinalokalnie/redaktor/WpMcp.java').read_text()
          main=pathlib.Path('il-redaktor-android/app/src/main/java/com/ispinalokalnie/redaktor/MainActivity.java').read_text()
          manifest=pathlib.Path('il-redaktor-android/app/src/main/AndroidManifest.xml').read_text()
          assert '"&scope=global"' in oauth, 'WordPress MCP requires the global scope, not auth-only'
          assert '"&scope=auth"' not in oauth, 'Auth-only scope cannot access WordPress MCP content'
          for expected in ['com.ispinalokalnie.redaktorsmart.stable:/callback','code_challenge_method=S256','PENDING_VERIFIER','handleRedirect']:
              assert expected in oauth, 'OAuth return missing: '+expected
          for required in ['\"method\", \"initialize\"', 'Mcp-Session-Id', 'notifications/initialized', 'ensureMcpSession(token)', 'ExpiredMcpSession', 'resetSession()']:
              assert required in mcp, 'Missing MCP session lifecycle: ' + required
          assert 'WpMcp.resetSession()' in main, 'Session must reset on account changes'
          assert 'response_types' in mcp and 'authorization_code' in mcp
          assert 'refresh_token' in mcp and 'refresh_token' in main, 'Token refresh is not wired end to end'
          assert 'putTokens(access, expires, refresh, true)' in main, 'Refresh token is not stored after consent'
          assert 'AndroidKeyStore' in main and 'encryptSecret' in main, 'Tokens are not encrypted at rest'
          assert 'JSONArray)data).length() == 0' in main, 'Login must confirm at least one existing article'
          assert 'response_type=token' not in main and 'response_type=token' not in oauth, 'Implicit OAuth flow must not be used'
          assert 'android:scheme="com.ispinalokalnie.redaktorsmart.stable"' in manifest
          import re
          redirect=re.search(r'public static final String REDIRECT = "([^"]+)"',oauth)
          assert redirect, 'OAuth REDIRECT must be defined'
          callback_scheme=redirect.group(1).split(':')[0]
          assert '"' + callback_scheme + '".equals(uri.getScheme())' in oauth, 'Critical regression: OAuth callback scheme mismatch'
          assert 'android:scheme="' + callback_scheme + '"' in manifest, 'Android manifest callback scheme mismatch'
          assert 'void finishLoginWithUrl' in main and 'void cancelLogin' in main, 'OAuth fallback controls missing'
          assert 'android.permission.VIBRATE' in manifest, 'Vibration permission missing'
          assert 'function setHapticsMode' in src and 'haptics-select' in src, 'Adjustable haptics controls missing'
          assert 'function openFacebookTeaser' in src and 'Wygeneruj zajawkę na Facebooka' in src, 'Facebook teaser generator missing'
          assert 'void testHaptics' in main and 'hasVibrationMotor' in main, 'Native vibration check missing'
          assert 'function finishManualLogin' in src and 'login-recovery' in src, 'Manual OAuth recovery missing'
          assert 'function testDraftWrite' in src and 'test-draft-write' in src, 'In-app write diagnostic missing'
          assert 'status:"draft"' in src, 'Diagnostic must create a draft, not a public post'
          assert 'function suggestRelatedReading' in src, 'Reader recommendations missing'
          assert 'function sendAssistantToApps' in src and 'function compareExternalAssistantResponse' in src, 'ChatGPT/Gemini return flow missing'
          assert 'void shareAssistantPrompt' in main and 'void readAssistantClipboard' in main, 'Native AI handoff or clipboard bridge missing'
          assert 'com.openai.chatgpt' in main and 'com.google.android.apps.bard' in main, 'ChatGPT first / Gemini fallback missing'
          assert 'function applyTemplate' in src and 'Zmiany w rozkładach MLD' in src and 'function showPublicationBundle' in src, 'Smart editorial templates or package missing'
          assert 'readingPromotions: z.array' in pathlib.Path('il-redaktor-android/backend/api/assistant.ts').read_text(), 'AI reader promotions missing'
          assert 'showPublishedPage' in main and 'isPublishedSiteUrl' in main, 'In-app published article view missing'
          for required in ['SUKCES!','NIE POWIODŁO SIĘ','function showOutcome','id="finish-dialog"']:
              assert required in src, 'Feedback UI missing: '+required
          assert 'client_secret' not in oauth and 'client_secret' not in src.lower()
          print('Required features and official IL branding confirmed')
          PY
          node --check /tmp/ilredaktor-ui.js
      - name: Verify OAuth redirect configuration without remote registration
        run: |
          python - <<'PY'
          import pathlib,re
          oauth=pathlib.Path('il-redaktor-android/app/src/main/java/com/ispinalokalnie/redaktor/OAuthBrowserLogin.java').read_text()
          manifest=pathlib.Path('il-redaktor-android/app/src/main/AndroidManifest.xml').read_text()
          redirect=re.search(r'public static final String REDIRECT = "([^"]+)"',oauth)
          assert redirect, 'OAuth redirect must be declared'
          uri=redirect.group(1)
          scheme=uri.split(':',1)[0]
          assert uri=='com.ispinalokalnie.redaktorsmart.stable:/callback', 'Unexpected callback URI'
          assert 'android:scheme="'+scheme+'"' in manifest, 'Manifest scheme must match OAuth redirect'
          assert 'code_challenge_method=S256' in oauth, 'PKCE must stay enabled'
          assert 'client_secret' not in oauth, 'Native OAuth must not embed a client secret'
          print('OAuth redirect, manifest scheme and PKCE verified without remote registration')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: il-redaktor-android/backend/package-lock.json
      - name: Test draft and publishing state without touching live WordPress
        run: |
          node --test il-redaktor-android/tests/publishing.test.cjs
          python - <<'PY'
          from pathlib import Path
          mcp=Path('il-redaktor-android/app/src/main/java/com/ispinalokalnie/redaktor/WpMcp.java').read_text()
          assert 'if (!list && ("posts".equals(type) || "pages".equals(type)))' in mcp
          assert 'if (list)' in mcp
          assert 'params.put("status",new JSONArray().put(status))' in mcp
          ui=Path('il-redaktor-android/app/src/main/assets/index.html').read_text()
          assert 'ZAPIS NIEZWERYFIKOWANY' in ui
          assert 'STATUS NIEPOTWIERDZONY' in ui
          assert 'postArticleViaMcp(token' in mcp, 'Article write must use WordPress MCP'
          assert '"posts.create" : "posts.update"' in mcp, 'Create and update must use MCP'
          assert 'getArticleViaMcp(token' in mcp, 'Read-after-write must use WordPress MCP'
          assert 'setPublishedUrl(link)' in ui
          assert 'Zobacz opublikowany wpis w aplikacji' in ui
          assert 'Zobacz artykuł na WordPressie' in ui
          assert 'function explainPublicationFailure' in ui
          assert 'function suggestRelatedReading' in ui and 'appendReadingLink' in ui
          assert '✓ Sukces! Artykuł został opublikowany na Ispina Lokalnie.' in ui
          assert 'Otwórz w przeglądarce' in ui and 'Edytuj ponownie' in ui and 'Wróć do pulpitu' in ui
          assert 'type="datetime-local"' in ui and 'status==="future"' in ui
          assert 'TERMIN NIEPOTWIERDZONY' in ui
          assert 'function verifyWordPressPostContents' in ui
          assert 'function readWordPressScheduleTime' in ui
          assert 'function formatArticleLocally' in ui and 'function formatArticleWithAI' in ui
          assert 'TREŚĆ NIEPOTWIERDZONA' in ui
          android=Path('il-redaktor-android/app/src/main/java/com/ispinalokalnie/redaktor/MainActivity.java').read_text()
          assert 'onStop()' in android and 'onBackPressed()' in android
          assert 'assistantFromEditor' in ui and 'copyAssistantFacebook' in ui
          assert 'imageSuggestion: z.object' in Path('il-redaktor-android/backend/api/assistant.ts').read_text()
          assert 'Nie zwracaj adresów URL zdjęć' in Path('il-redaktor-android/backend/api/assistant.ts').read_text()
          assert 'publicationButtons(true)' in ui and 'publicationButtons(false)' in ui
          assert 'Ostatnie działania' in ui
          assert 'acceptedState = true' in Path('il-redaktor-android/app/src/main/java/com/ispinalokalnie/redaktor/OAuthBrowserLogin.java').read_text()
          assert 'AES/GCM/NoPadding' in Path('il-redaktor-android/app/src/main/java/com/ispinalokalnie/redaktor/MainActivity.java').read_text()
          print('Publishing mapping, persistence verification and operation reporting present')
          PY
      - name: Typecheck optional AI backend
        working-directory: il-redaktor-android/backend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run typecheck
      - name: Compile Android APK
        working-directory: il-redaktor-android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Build previous 1.15 debug APK with the same CI debug signing key
        run: |
          git fetch --depth=1 origin 17333f654fae324384b5c09dd1a7fd94da8e4359
          git worktree add --detach "$RUNNER_TEMP/il-previous" 17333f654fae324384b5c09dd1a7fd94da8e4359
          cp -R il-redaktor-android/app/src/main/res "$RUNNER_TEMP/il-previous/il-redaktor-android/app/src/main/"
          gradle --no-daemon -p "$RUNNER_TEMP/il-previous/il-redaktor-android" :app:assembleDebug
          cp "$RUNNER_TEMP/il-previous/il-redaktor-android/app/build/outputs/apk/debug/app-debug.apk" /tmp/il-previous-debug.apk
      - name: Enable Android emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test Android 8 (API 26) WebView and update flow without WordPress writes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          ram-size: 3072M
          script: bash il-redaktor-android/scripts/run-emulator-smoke.sh 26
      - name: Test Android 11 (API 30) WebView and update flow without WordPress writes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          ram-size: 3072M
          script: bash il-redaktor-android/scripts/run-emulator-smoke.sh 30
      - name: Test Android 13 (API 33) WebView and update flow without WordPress writes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          ram-size: 3072M
          script: bash il-redaktor-android/scripts/run-emulator-smoke.sh 33
      - name: Upload emulator UI checks
        uses: actions/upload-artifact@v4
        with:
          name: IL-Redaktor-UI-Checks
          path: /tmp/il-editor-ui-api-*/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Confirm APK and actual monogram
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APK="il-redaktor-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test -s il-redaktor-android/app/src/main/assets/il-monogram.png
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.ispinalokalnie.redaktorsmart.stable' versionCode='30' versionName='1.22.2'"
          unzip -l "$APK" | grep 'assets/il-monogram.png'
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: IL-Redaktor-Smart-APK
          path: il-redaktor-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Build unsigned release for permanent private signing
        working-directory: il-redaktor-android
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: IL-Redaktor-Unsigned-Release
          path: il-redaktor-android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
      - name: Build existing-key signed release for safe Android upgrades (optional)
        env:
          IL_RELEASE_KEYSTORE_B64: ${{ secrets.IL_RELEASE_KEYSTORE_B64 }}
          IL_RELEASE_KEY_ALIAS: ${{ secrets.IL_RELEASE_KEY_ALIAS }}
          IL_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.IL_RELEASE_KEYSTORE_PASSWORD }}
          IL_RELEASE_KEY_PASSWORD: ${{ secrets.IL_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$IL_RELEASE_KEYSTORE_B64" ] || [ -z "$IL_RELEASE_KEY_ALIAS" ] ||
             [ -z "$IL_RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$IL_RELEASE_KEY_PASSWORD" ]; then
            echo "Existing release signing secrets unavailable; signed upgrade APK not produced."
            exit 0
          fi
          export IL_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/il-existing-release.jks"
          trap 'rm -f "$IL_RELEASE_KEYSTORE_PATH"' EXIT
          printf '%s' "$IL_RELEASE_KEYSTORE_B64" | base64 --decode > "$IL_RELEASE_KEYSTORE_PATH"
          chmod 600 "$IL_RELEASE_KEYSTORE_PATH"
          gradle --no-daemon -p il-redaktor-android :app:assembleRelease
          APK="il-redaktor-android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          "$SIGNER" verify --verbose "$APK"
          ACTUAL="$("$SIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -cd '0-9a-fA-F' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(tr -cd '0-9a-fA-F' < il-redaktor-android/release-certificate.sha256 | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: signing certificate differs from installed stable IL Redaktor release certificate."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/il-signed-upgrade"
          cp "$APK" "$RUNNER_TEMP/il-signed-upgrade/IL-Redaktor-Smart-1.22.2-UPDATE.apk"
          echo "Signed upgrade APK created with the existing release certificate."
      - name: Upload verified signed upgrade when available
        uses: actions/upload-artifact@v4
        with:
          name: IL-Redaktor-Signed-Upgrade
          path: ${{ runner.temp }}/il-signed-upgrade/IL-Redaktor-Smart-1.22.2-UPDATE.apk
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: IL-Redaktor-Signing-Tools
          path: /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar
          retention-days: 30
