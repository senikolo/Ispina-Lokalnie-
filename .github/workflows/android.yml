name: Validate planner release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: planner/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planner-regression-results
          path: planner/tests/output/*.json
