name: Build Ispina Lokalnie UltraSmart 82 Radio TEST
on:
  push:
    branches: ['codex/il-ultrasmart82-radio-20261106']
    paths: ['tools/ultrasmart82-radio/**', '.github/workflows/build-ultrasmart82-radio.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch exact 82 TEST V2 and verify radio UI
        env:
          GH_TOKEN: ${{ github.token }}
          IL_TEST_KEY: ${{ secrets.IL_ULTRASMART78_TEST_KEYSTORE_B64 }}
          IL_TEST_PASS: ${{ secrets.IL_ULTRASMART78_TEST_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          mkdir -p base output
          gh release download v2.0.0-smart.82-test -p Ispina-Lokalnie-82-YouTube-Kamery-TEST-V2.apk -D base
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --print-certs base/*.apk > base/verify.txt
          grep -qi '3c7438761d2accca13da08defe4b62a814c3a3d2201c374f5c2e943115591d82' base/verify.txt
          variant=()
          if [[ -z "$IL_TEST_KEY" || -z "$IL_TEST_PASS" ]]; then
            variant=(--isolated)
          fi
          python3 tools/ultrasmart82-radio/patch_radio.py base/*.apk unsigned.apk "${variant[@]}"
          unzip -p unsigned.apk assets/main_ui.js > ui.js
          node --check ui.js
          node tools/ultrasmart82-radio/test_radio.cjs ui.js
          "$bt/zipalign" -p -f 4 unsigned.apk aligned.apk
      - name: Sign and verify test APK
        env:
          IL_TEST_KEY: ${{ secrets.IL_ULTRASMART78_TEST_KEYSTORE_B64 }}
          IL_TEST_PASS: ${{ secrets.IL_ULTRASMART78_TEST_KEYSTORE_PASS }}
          IL_TEST_KEY_PASS: ${{ secrets.IL_ULTRASMART78_TEST_KEY_PASS }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/il82-radio.p12"
          trap 'rm -f "$key"' EXIT
          alias=ultrasmart78-test
          package=com.ispina.mldcheck.smartai78test
          expected=3c7438761d2accca13da08defe4b62a814c3a3d2201c374f5c2e943115591d82
          if [[ -n "$IL_TEST_KEY" && -n "$IL_TEST_PASS" ]]; then
            printf '%s' "$IL_TEST_KEY" | base64 --decode > "$key"
          else
            package=com.ispina.mldcheck.smartai82test
            alias=il82-radio-test
            export IL_TEST_PASS="$(openssl rand -hex 24)"
            export IL_TEST_KEY_PASS="$IL_TEST_PASS"
            keytool -genkeypair -noprompt -keystore "$key" -storepass:env IL_TEST_PASS -keypass:env IL_TEST_KEY_PASS -alias "$alias" -dname 'CN=Ispina Lokalnie Radio 82 Test' -keyalg RSA -keysize 3072 -validity 3650 -storetype PKCS12
            expected="$(keytool -exportcert -keystore "$key" -storepass:env IL_TEST_PASS -alias "$alias" | sha256sum | cut -d' ' -f1)"
          fi
          export IL_TEST_KEY_PASS="${IL_TEST_KEY_PASS:-$IL_TEST_PASS}"
          actual="$(keytool -exportcert -keystore "$key" -storepass:env IL_TEST_PASS -alias "$alias" | sha256sum | cut -d' ' -f1)"
          test "$actual" = "$expected"
          bt="$ANDROID_HOME/build-tools/35.0.0"
          apk=output/Ispina-Lokalnie-82-Radio-Krakow-TEST.apk
          "$bt/apksigner" sign --ks "$key" --ks-key-alias "$alias" --ks-pass env:IL_TEST_PASS --key-pass env:IL_TEST_KEY_PASS --v4-signing-enabled false --out "$apk" aligned.apk
          "$bt/apksigner" verify --verbose --print-certs "$apk" > output/signature.txt
          grep -q "certificate SHA-256 digest: $expected" output/signature.txt
          "$bt/zipalign" -c -p 4 "$apk"
          "$bt/aapt" dump badging "$apk" > output/badging.txt
          grep -q "name='$package' versionCode='20356' versionName='2.0.0-smart.82'" output/badging.txt
          sha256sum "$apk" > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Ispina-Lokalnie-82-Radio-Krakow-TEST
          path: output/
          if-no-files-found: error
          retention-days: 60
