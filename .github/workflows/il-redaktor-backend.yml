name: Validate IL Redaktor assistant backend

on:
  pull_request:
    paths:
      - "il-redaktor-android/backend/**"
      - ".github/workflows/il-redaktor-backend.yml"
  push:
    branches:
      - main
    paths:
      - "il-redaktor-android/backend/**"
      - ".github/workflows/il-redaktor-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: il-redaktor-android/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: il-redaktor-android/backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
