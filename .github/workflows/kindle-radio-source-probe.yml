name: Verify Program 1 and Brazilian Birds stream formats
on:
  push:
    branches: [feat/kindle-somafm-stream-stability-20261112]
    paths: ['.github/workflows/kindle-radio-source-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  radio-source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Probe real audio streams (metadata and frames)
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, subprocess, tempfile, os
          stations = {
            "PR1 mp3 port": "http://stream3.polskieradio.pl:8900/",
            "PR1 alternate mp3": "http://mp3.polskieradio.pl:8900/",
            "PR1 playlist": "http://stream3.polskieradio.pl:8900/listen.pls",
            "PR1 HLS": "https://stream11.polskieradio.pl/pr1/pr1.sdp/playlist.m3u8",
            "Brazilian mobile HTTPS": "https://strm112.1.fm/brazilianbirds_mobile_mp3",
            "Brazilian mobile HTTP": "http://strm112.1.fm/brazilianbirds_mobile_mp3",
            "Brazilian MP3 128": "http://185.33.21.112:80/brazilianbirds_128",
          }
          for name, url in stations.items():
            print("\\nPROBE:", name, url, flush=True)
            try:
              req = urllib.request.Request(url, headers={"User-Agent":"MPlayer/1.4","Icy-MetaData":"0"})
              with urllib.request.urlopen(req, timeout=15) as resp:
                print("FINAL_URL", resp.url, "STATUS", resp.status, "CONTENT_TYPE", resp.headers.get("content-type"), "ICY_BR", resp.headers.get("icy-br"),flush=True)
                data = resp.read(56000)
              print("AUDIO_BYTES",len(data), "PREFIX", repr(data[:80]), flush=True)
              if "HLS" in name or "playlist" in name:
                print("PLAYLIST",data[:700].decode("utf-8","replace"),flush=True)
              else:
                with tempfile.NamedTemporaryFile(delete=False,suffix=".mp3") as temp:
                  temp.write(data)
                  path=temp.name
                try:
                  cp=subprocess.run(["ffprobe","-v","error","-f","mp3","-show_entries","format=bit_rate:stream=codec_name,bit_rate","-of","default=noprint_wrappers=1",path],capture_output=True,text=True,timeout=12)
                  print("FFPROBE",cp.returncode,cp.stdout[:800],cp.stderr[:400],flush=True)
                finally: os.unlink(path)
            except Exception as e: print("ERROR",type(e).__name__,str(e),flush=True)
          PY
