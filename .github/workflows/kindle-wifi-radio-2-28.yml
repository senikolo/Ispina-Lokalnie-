name: Kindle Wi-Fi 2.28
on:
  push:
    branches: [codex/kindle-wifi-radio-audio-2-26-20261110]
    paths: ['kindle-wifi/**', '.github/workflows/kindle-wifi-radio-2-28.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: SDK and test dependencies
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg openssh-server lua5.3
      - name: Transfers, player controller and diagnostics
        working-directory: kindle-wifi
        run: |
          bash tests/run-atomic-tests.sh
          bash tests/run-sftp-tests.sh
          bash tests/run-stream-probe-tests.sh
          python3 tests/run-he-diagnostic-tests.py
          lua5.3 tests/tuning-test.lua assets/ilradio_k3.koplugin
          lua5.3 tests/radio-menu-test.lua assets/ilradio_k3.koplugin legacy
      - name: Phone and emulator builds
        working-directory: kindle-wifi
        run: |
          mkdir -p ../build-artifacts
          gradle --no-daemon -ParmOnly assembleRelease
          cp build/outputs/apk/release/*-unsigned.apk ../build-artifacts/phone-unsigned.apk
          test "$(stat -c %s ../build-artifacts/phone-unsigned.apk)" -lt 30000000
          gradle --no-daemon assembleRelease
          cp build/outputs/apk/release/*-unsigned.apk ../build-artifacts/emulator-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kindle-WiFi-2.28
          path: build-artifacts/
  android-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 30, 33]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kindle-WiFi-2.28
          path: build-artifacts
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Sign emulator copy and enable KVM
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/emulator.p12" -storepass android -alias emulator -dname CN=Emulator -keyalg RSA -keysize 2048 -validity 2
          sdkmanager 'build-tools;35.0.0'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/emulator.p12" --ks-pass pass:android --out "$RUNNER_TEMP/emulator.apk" build-artifacts/emulator-unsigned.apk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kindlewifi-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/emulator.apk"
            adb shell am start -W -n pl.ispinalokalnie.kindlewifi.v23/pl.ispinalokalnie.kindlewifi.MainActivity | tee "$RUNNER_TEMP/launch.txt"
            grep -F 'Status: ok' "$RUNNER_TEMP/launch.txt"
            adb shell uiautomator dump /sdcard/kindle-ui.xml
            adb shell cat /sdcard/kindle-ui.xml | grep -Fq 'Twoja kolejka'
