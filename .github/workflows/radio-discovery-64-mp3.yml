name: Discover verified MP3 streams up to 64 kbps
on:
  push:
    branches: [feat/kindle-somafm-stream-stability-20261112]
    paths: ['.github/workflows/radio-discovery-64-mp3.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Query live Radio Browser catalog
        run: |
          python3 - <<'PY'
          import urllib.parse, urllib.request, json, concurrent.futures
          HOST="https://de1.api.radio-browser.info/json/stations/search"
          querysets = [
            {"countrycode":"PL"}, {"tag":"chillout"}, {"tag":"ambient"},
            {"tag":"jazz"}, {"tag":"lounge"}, {"tag":"relax"},
            {"tag":"bossa nova"}, {"tag":"classical"}, {"tag":"nature"},
            {"tag":"oldies"}, {"tag":"talk"}, {"tag":"news"},
            {"tag":"instrumental"}, {"tag":"easy listening"},
            {"tag":"world music"}, {"tag":"blues"}, {"tag":"downtempo"},
            {}, {"countrycode":"DE"}, {"countrycode":"GB"},
          ]
          def search(q):
            args=dict(codec="MP3",bitrateMin=16,bitrateMax=64,hidebroken="true",order="votes",reverse="true",limit=120)
            args.update(q)
            url=HOST+"?"+urllib.parse.urlencode(args)
            req=urllib.request.Request(url,headers={"User-Agent":"KindleRadioMP364/1.0 (research; contact via GitHub)"})
            with urllib.request.urlopen(req,timeout=25) as f: data=json.load(f)
            return q,data
          result=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
            for fut in concurrent.futures.as_completed([pool.submit(search,q) for q in querysets]):
              try:
                q,data=fut.result()
                print("QUERY",q,"TOTAL",len(data),flush=True)
                result+=data
              except Exception as e: print("QUERY ERROR",type(e).__name__,str(e),flush=True)
          unique={}
          for st in result:
            if st.get("codec","").upper()!="MP3" or not (16<=st.get("bitrate",0)<=64): continue
            url=st.get("url_resolved") or st.get("url") or ""
            if not url.startswith(("http://","https://")) or url.endswith((".m3u",".pls",".m3u8")):continue
            uid=st.get("stationuuid") or url
            if uid not in unique or st.get("votes",0)>unique[uid].get("votes",0):unique[uid]=st
          selected=sorted(unique.values(),key=lambda v:v.get("votes",0),reverse=True)
          print("CANDIDATES_TOTAL",len(selected),flush=True)
          for st in selected[:180]:
            print("CANDIDATE", json.dumps({k:st.get(k) for k in ("name","bitrate","codec","votes","countrycode","tags","url","url_resolved","lastcheckok","lastchecktime")},ensure_ascii=False),flush=True)
          PY
