name: Kindle przez Wi-Fi 2.3 - APK
on:
  push:
    branches: [kindle-wifi-v23-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unpack application sources
        run: unzip -q kindle-wifi-v23-sources.zip
      - name: Build APK and prepare unsigned package for private signing
        shell: bash
        run: |
          set -euo pipefail
          export KINDLE_APK_KEY_PASSWORD="$(openssl rand -hex 18)"
          bash kindle-wifi-v5/build.sh "$GITHUB_WORKSPACE/temporary-v23.apk"
          cp kindle-wifi-v5/.build-work/unsigned.apk unsigned-v23.apk
          cp kindle-wifi-v5/.build-tools/apksig.jar apksig-build.jar
          cp kindle-wifi-v5/.build-work/signer/SignApk.class SignApk.class
          unzip -t unsigned-v23.apk | tail -2
      - name: Upload unsigned package for signing outside GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Kindle-v23-unsigned-for-private-signing
          path: |
            unsigned-v23.apk
            apksig-build.jar
            SignApk.class
          if-no-files-found: error
          retention-days: 7
