name: Kindle WiFi 2.5 APK build
on:
  push:
    branches:
      - codex/kindle-wifi-2.5-20261109
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms" || true
          ls -1 "$ANDROID_HOME/build-tools" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" || true
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" || true
          fi
      - name: Install Gradle 8.7 from GitHub
        run: |
          curl -fL --retry 4 --retry-delay 4 --output /tmp/gradle-8.7-bin.zip             https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Unpack sources
        run: unzip -q kindle-build/Kindle-przez-WiFi-2.5-zrodla.zip -d work
      - name: Build unsigned APK
        working-directory: work/kindle-wifi-ocr-v25
        run: gradle --no-daemon assembleRelease --stacktrace
      - name: Collect signer
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" work/apksigner.jar
      - name: Save unsigned APK and signer
        uses: actions/upload-artifact@v4
        with:
          name: Kindle-przez-WiFi-2.5-unsigned
          path: |
            work/kindle-wifi-ocr-v25/build/outputs/apk/release/*.apk
            work/apksigner.jar
          if-no-files-found: error
