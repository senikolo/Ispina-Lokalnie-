name: Kindle WiFi 2.5 APK build
on:
  push:
    branches:
      - codex/kindle-wifi-2.5-20261109
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unpack restored sources
        run: unzip -q kindle-build/Kindle-przez-WiFi-2.5-zrodla.zip -d work
      - name: Build unsigned release
        working-directory: work/kindle-wifi-ocr-v25
        run: gradle --no-daemon assembleRelease
      - name: Save unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Kindle-przez-WiFi-2.5-unsigned
          path: work/kindle-wifi-ocr-v25/build/outputs/apk/release/*.apk
          if-no-files-found: error
