name: Build source-based F-Droid candidate

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "fdroid-source-candidate/fdroid-source/**"
      - "fdroid-source-candidate/.github/workflows/fdroid-source-candidate.yml"
      - ".github/workflows/fdroid-source-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK 34
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK from the source project
        working-directory: fdroid-source-candidate/fdroid-source/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ispina-lokalnie-fdroid-source-candidate
          path: fdroid-source-candidate/fdroid-source/android/app/build/outputs/apk/debug/app-debug.apk
