name: Kindle przez Wi-Fi 2.4 OCR
on:
  push:
    branches: [kindle-wifi-v24-ocr-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Create source tree with OCR
        run: |
          unzip -q kindle-wifi-v23-sources.zip
          python3 scripts/patch_v24_ocr.py
      - name: Compile Android APK offline OCR model
        run: |
          cd kindle-wifi-v5
          gradle --no-daemon --stacktrace assembleRelease
          find build/outputs/apk/release -type f -maxdepth 1 -ls
      - name: Verify and export unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          cp kindle-wifi-v5/build/outputs/apk/release/*unsigned.apk Kindle-przez-WiFi-2.4-OCR-unsigned.apk
          unzip -t Kindle-przez-WiFi-2.4-OCR-unsigned.apk | tail -1
          test -s Kindle-przez-WiFi-2.4-OCR-unsigned.apk
      - name: Upload unsigned release for private signing
        uses: actions/upload-artifact@v4
        with:
          name: kindle-v24-ocr-unsigned
          path: Kindle-przez-WiFi-2.4-OCR-unsigned.apk
          retention-days: 7
