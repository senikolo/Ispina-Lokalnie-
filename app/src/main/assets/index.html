<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f84">
  <title>Ispina Lokalnie</title>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">I</span>
        <span><strong>Ispina Lokalnie</strong><small>Łączy nas Ispina</small></span>
      </div>
      <button id="seniorToggle" class="icon-button" type="button" aria-label="Włącz tryb Senior" title="Tryb Senior">Aa</button>
    </header>

    <main id="mainContent" class="main-content" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Główna nawigacja">
      <button type="button" data-screen="home" aria-current="page"><span aria-hidden="true">⌂</span><small>Start</small></button>
      <button type="button" data-screen="planner"><span aria-hidden="true">🚌</span><small>Autobusy</small></button>
      <button type="button" data-screen="news"><span aria-hidden="true">▤</span><small>Wiadomości</small></button>
      <button type="button" data-screen="waste"><span aria-hidden="true">♻</span><small>Odpady</small></button>
      <button type="button" data-screen="more"><span aria-hidden="true">☰</span><small>Więcej</small></button>
    </nav>
    <div id="liveRegion" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
